name: Generate Contribution Snake Animation
on:
  # 每日0点自动更新
  schedule:
    - cron: "0 0 * * *"
  # 手动触发运行
  workflow_dispatch:
jobs:
  snake-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 拉取仓库代码
      - name: Checkout repo
        uses: actions/checkout@v5

      # 生成贪吃蛇SVG（浅色+深色双版本）
      - name: Generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg
            assets/snake-dark.svg?palette=github-dark
        env:
          # 系统自带token，无需手动创建PAT
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 自动提交生成的SVG文件回仓库
      - name: Commit & Push snake files
        run: |
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@github.com"
          git add assets/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update contribution snake"
          git push
