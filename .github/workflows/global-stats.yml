name: Auto Update Global GitHub Stats
# 触发规则
on:
  # 每日UTC 0点 = 北京时间上午8点自动更新全局数据
  schedule:
    - cron: "0 0 * * *"
  # 页面手动点击运行
  workflow_dispatch:
  # 推送代码时同步刷新卡片
  push:
    branches: [ main ]

jobs:
  build-stats:
    runs-on: ubuntu-latest
    # 仅保留合法权限，删除 metadata: read
    permissions:
      contents: write
    steps:
      # 1. 拉取仓库代码（升级v5消除Node20弃用警告）
      - name: Checkout repository code
        uses: actions/checkout@v5

      # 2. 生成【账号全局总数据卡片】（所有仓库总Star、总提交、贡献天数）
      - name: Generate Global All-Repo Stats Card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=wangmc1024&show_icons=true&theme=tokyonight&hide_border=true'
          path: assets/global-all-stats.svg
          # 固定使用你存入Secrets的完整权限Token
          token: ${{ secrets.GH_FULL_TOKEN }}

      # 3. 生成【全局编程语言统计卡片】（账号所有仓库代码语言占比）
      - name: Generate Global Top Languages Card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=wangmc1024&layout=compact&theme=tokyonight&hide_border=true'
          path: assets/global-top-langs.svg
          token: ${{ secrets.GH_FULL_TOKEN }}

      # 4. 自动提交生成的svg文件回仓库，无变更则跳过
      - name: Commit & Push new SVG cards
        run: |
          git config --global user.name "GitHub Auto Bot"
          git config --global user.email "bot@github.com"
          git add assets/
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update global all-repo stats card"
          git push
